name: company-os
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: companyos
      POSTGRES_PASSWORD: companyos
      POSTGRES_DB: companyos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companyos']
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    # Serveur Temporal de développement (SQLite embarqué) + UI web sur :8233.
    image: temporalio/temporal:1.5.1
    user: '0:0' # le volume nommé appartient à root
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/data/temporal.db']
    ports:
      - '7233:7233'
      - '8233:8233'
    volumes:
      - temporaldata:/data
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  pgdata:
  temporaldata:
