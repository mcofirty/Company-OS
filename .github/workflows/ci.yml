name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos
          POSTGRES_DB: companyos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U companyos" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://companyos:companyos@localhost:5432/companyos
      DATABASE_URL_TEST: postgresql://companyos:companyos@localhost:5432/companyos_test
      APP_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=companyos psql -h localhost -U companyos -c "CREATE DATABASE companyos_test"
      - name: Serveur Temporal (dev)
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:1.5.1 server start-dev --ip 0.0.0.0
          for i in $(seq 1 40); do docker exec temporal temporal operator cluster health --address 127.0.0.1:7233 && break; sleep 2; done
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Vulnérabilités connues des dépendances de production (docs/11 §6).
      - run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos
          POSTGRES_DB: companyos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U companyos" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Serveur Temporal (dev)
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:1.5.1 server start-dev --ip 0.0.0.0
          for i in $(seq 1 40); do docker exec temporal temporal operator cluster health --address 127.0.0.1:7233 && break; sleep 2; done
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm e2e

  images:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API + worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/server.Dockerfile
          tags: company-os-server:ci
          load: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Image migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/server.Dockerfile
          target: migrate
          tags: company-os-migrate:ci
          cache-from: type=gha,scope=server
      - name: Image cockpit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          tags: company-os-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Refus de démarrer sans authentification en production
        run: |
          out=$(docker run --rm -e NODE_ENV=production -e DATABASE_URL=postgresql://x@localhost/x \
            -e WEB_ORIGIN=https://hq.example.com company-os-server:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Configuration refusée"
